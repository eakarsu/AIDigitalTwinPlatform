name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "server/package-lock.json" }
      - run: npm ci && npm test
        working-directory: server
      - run: psql "$DATABASE_URL" -c "CREATE TABLE users(id BIGSERIAL PRIMARY KEY)" && for f in server/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done && for f in server/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: npm ci && npm run build
        working-directory: client
      - run: bash -n start.sh scripts/*.sh
